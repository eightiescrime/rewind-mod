plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // клиентский код живёт отдельно от серверного: на выделенном сервере
    // классы из src/client никогда не грузятся, поэтому рендер и HUD физически
    // не могут уронить сервер
    splitEnvironmentSourceSets()

    mods {
        "rewind" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    // Accessories — мягкая зависимость: слот для реликвии, если мод стоит
    maven { url = "https://maven.wispforest.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // только для компиляции: во время игры этих классов может не быть,
    // и трогает их единственный класс compat/AccessoriesRelic
    modCompileOnly "io.wispforest:accessories-fabric:${project.accessories_version}"
    // а в дев-клиент мод ставится по-настоящему: слот реликвии надо видеть
    // глазами. В собранный джарник эта зависимость не попадает
    modLocalRuntime "io.wispforest:accessories-fabric:${project.accessories_version}"

    // ClientTemporalState и расчёт шрама — чистая логика без единого класса
    // Minecraft, поэтому их можно проверять обычным юнит-тестом
    testImplementation sourceSets.client.output

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}
